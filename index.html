<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HI Inc. eblast — preview</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f4f4f2;
      color: #022A4D;
      font-family: Arial, Helvetica, sans-serif;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 400; margin: 0 0 8px; }
    .meta {
      background: #fff;
      border: 1px solid #e2e2e0;
      border-radius: 8px;
      padding: 16px 20px;
      margin: 0 0 24px;
      font-size: 14px;
      line-height: 1.45;
    }
    .meta dt { color: #667; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-top: 10px; }
    .meta dt:first-child { margin-top: 0; }
    .meta dd { margin: 2px 0 0; }
    .frame {
      background: #E8E8E8;
      border: 1px solid #ddd;
      box-shadow: 0 8px 24px rgba(2,42,77,.08);
    }
    iframe { display: block; width: 100%; height: 520px; border: 0; background: #E8E8E8; }
    .links { margin-top: 20px; font-size: 13px; }
    .links a { color: #009A91; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Human Interest — Inc. eblast</h1>
    <dl class="meta">
      <dt>Subject</dt>
      <dd>Spending too much time on 401(k) admin?</dd>
      <dt>Preview</dt>
      <dd>It’s time to explore a plan designed and built to work better with your business.</dd>
      <dt>CTA</dt>
      <dd><a href="https://humaninterest.com/signup/fast-track/">humaninterest.com/signup/fast-track/</a></dd>
    </dl>
    <div class="frame">
      <iframe src="email.html" title="Email preview"></iframe>
    </div>
    <p class="links">
      Open the Marketo HTML: <a href="email.html">email.html</a>
    </p>
  </div>
</body>
</html>
